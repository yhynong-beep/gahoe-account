<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>추억장소 - 영형 여혼</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.08);
        }

        header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #ffffff;
            padding: 28px 20px 26px 20px;
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.12);
        }

        header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        header p {
            margin-top: 6px;
            font-size: 14px;
            opacity: 0.85;
        }

        main {
            flex: 1;
            padding: 20px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .photo-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        .photo-card button {
            display: block;
            width: 100%;
            padding: 0;
            border: 0;
            background: none;
            cursor: zoom-in;
        }

        .photo-card img {
            display: block;
            width: 100%;
            height: auto;
            background: #e2e8f0;
        }

        .photo-card .caption {
            padding: 14px 18px 16px 18px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .photo-card .caption span {
            display: block;
            margin-bottom: 2px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
        }

        .photo-card button:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: -3px;
        }

        /* 사진 크게 보기 */
        .viewer {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.92);
            padding: 16px;
        }

        .viewer.open {
            display: flex;
        }

        .viewer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .viewer .close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 22px;
            font-size: 13px;
            color: var(--text-sub);
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
