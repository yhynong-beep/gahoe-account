<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가호회 이월금</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f4f9;--ink:#1f2937;--mute:#64748b;--line:#e2e8f0;--accent:#4f46e5;--pad:max(20px,calc((100% - 560px)/2 + 20px));color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;line-height:1.6}
header{background:linear-gradient(135deg,#4338ca,#7c3aed);color:#fff;border-radius:0 0 28px 28px;padding:max(48px,env(safe-area-inset-top)) var(--pad) 32px;box-shadow:0 8px 24px rgba(79,70,229,.2)}
h1{font-weight:700;font-size:28px;letter-spacing:-.01em;line-height:1.3;margin:0}
header p{margin:6px 0 0;color:rgba(255,255,255,.8);font-size:15px}
main{max-width:560px;margin:0 auto;padding:20px 16px max(48px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.hero{background:#fff;border-radius:20px;padding:22px 22px 20px;box-shadow:0 2px 10px rgba(30,41,59,.08);border:1px solid var(--line)}
.hero small{display:block;color:var(--mute);font-size:15px;font-weight:700}
.hero strong{display:block;margin-top:2px;font-size:clamp(34px,10vw,44px);line-height:1.2;color:var(--accent);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero strong span{font-size:.5em;margin-left:4px;color:var(--ink)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sum div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 10px;box-shadow:0 2px 10px rgba(30,41,59,.06);text-align:center}
.sum small{display:block;color:var(--mute);font-size:13px}
.sum b{display:block;font-size:15px;font-variant-numeric:tabular-nums;margin-top:2px}
.sum .last{background:var(--accent);border-color:var(--accent);color:#fff}
.sum .last small{color:rgba(255,255,255,.8)}
.photo{padding:0;border:0;background:#fff;border-radius:16px;overflow:hidden;width:100%;display:block;cursor:zoom-in;box-shadow:0 2px 10px rgba(30,41,59,.08)}
.photo img{width:100%;height:auto;display:block}
.photo span{display:block;padding:10px 14px;text-align:left;color:var(--mute);font-size:14px;border-top:1px solid var(--line)}
.photo:focus-visible,.lb button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lb{position:fixed;inset:0;background:rgba(15,23,42,.95);display:none;align-items:center;justify-content:center;z-index:10;padding:56px 6px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lb button{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:50%;width:52px;height:52px;font-size:22px;cursor:pointer}
@media (max-width:380px){.sum b{font-size:14px}}
</style>
</head>
<body>
<header>
<h1>가호회 이월금</h1>
<p>사진을 누르면 크게 볼 수 있어요</p>
</header>
<main>
<section class="hero" aria-label="이월금">

<div class="last"><small>잔액</small><b>8,453,674원</b></div>
</section>

<script>
const lb=document.getElementById('lb');
function close(){lb.classList.remove('on');document.body.style.overflow=''}
document.getElementById('open').onclick=()=>{lb.classList.add('on');document.body.style.overflow='hidden';document.getElementById('cl').focus()};
document.getElementById('cl').onclick=close;
lb.onclick=e=>{if(e.target===lb)close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
