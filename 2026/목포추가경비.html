<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>목포 신안 추가 경비 각출</title>
  <style>
    :root {
      --navy: #17324d;
      --blue: #285b83;
      --orange: #f2ad62;
      --orange-light: #fff3e5;
      --line: #d8e1e9;
      --muted: #64748b;
      --bg: #f3f6fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 18px;
      display: grid;
      place-items: start center;
      background: var(--bg);
      color: #243447;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }
    .sheet {
      width: min(100%, 760px);
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(23, 50, 77, .10);
      border: 1px solid #e7edf3;
    }
    header {
      padding: 34px 36px 28px;
      color: white;
      background: linear-gradient(135deg, #17324d, #285b83);
    }
    .eyebrow {
      margin: 0 0 10px;
      color: #c9d9e7;
      font-size: 13px;
      letter-spacing: .12em;
      font-weight: 700;
    }
    h1 {
      margin: 0;
      font-size: clamp(23px, 4vw, 31px);
      letter-spacing: -.04em;
    }
    main { padding: 30px 36px 36px; }
    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 28px;
    }
    .summary-card {
      padding: 19px 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fbfcfe;
    }
    .summary-card.total {
      background: var(--orange-light);
      border-color: #f4d2ad;
    }
    .label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .value {
      font-size: clamp(20px, 3.5vw, 27px);
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -.03em;
      white-space: nowrap;
    }
    .total .value { color: #a75b16; }
    h2 {
      margin: 0 0 13px;
      font-size: 17px;
      color: var(--navy);
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 480px;
      text-align: center;
    }
    thead { background: var(--orange); color: #352718; }
    th {
      padding: 14px 12px;
      font-size: 14px;
      font-weight: 800;
    }
    td {
      padding: 17px 12px;
      border-top: 1px solid var(--line);
      font-size: 15px;
      font-weight: 600;
    }
    tbody tr { background: #fff; }
    tbody tr:hover { background: #fffaf4; }
    td.amount { color: #a75b16; font-weight: 800; }
    td.note { color: #526579; font-weight: 500; }
    footer {
      margin-top: 18px;
      color: #8794a3;
      font-size: 12px;
      text-align: right;
    }
    @media (max-width: 560px) {
      body { padding: 16px 10px; }
      header { padding: 26px 22px 23px; }
      main { padding: 22px 18px 26px; }
      .summary { grid-template-columns: 1fr; gap: 10px; }
      .summary-card { padding: 15px 17px; }
    }
    @media print {
      body { padding: 0; background: #fff; }
      .sheet { width: 100%; box-shadow: none; border: 0; }
    }
  </style>
</head>
<body>
  <article class="sheet">
    <header>
      <p class="eyebrow">경비 정산 안내</p>
      <h1>목포 신안 추가 경비 각출</h1>
    </header>
    <main>
      <section class="summary" aria-label="각출 요약">
        <div class="summary-card">
          <span class="label">각출금 납부 인원</span>
          <div class="value">21명</div>
        </div>
        <div class="summary-card total">
          <span class="label">총 각출금</span>
          <div class="value">₩798,000</div>
        </div>
      </section>

      <section>
        <h2>납부 내역</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">연번</th>
                <th scope="col">성명</th>
                <th scope="col">총 각출금</th>
                <th scope="col">비고</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>21명</td>
                <td class="amount">₩798,000</td>
                <td class="note">21명 각 38,000원</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
      <footer>총 21명 · 1인당 납부 금액 ₩38,000</footer>
    </main>
  </article>
</body>
</html>
