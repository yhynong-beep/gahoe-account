<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026년 가호회 회비 및 찬조</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f4f9;--ink:#1f2937;--mute:#64748b;--line:#e2e8f0;--accent:#4f46e5;--soft:#eef2ff;--pad:max(20px,calc((100% - 560px)/2 + 20px));color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;line-height:1.5}
header{background:linear-gradient(135deg,#4338ca,#7c3aed);color:#fff;border-radius:0 0 28px 28px;padding:max(48px,env(safe-area-inset-top)) var(--pad) 32px;box-shadow:0 8px 24px rgba(79,70,229,.2)}
h1{font-weight:700;font-size:26px;letter-spacing:-.01em;line-height:1.3;margin:0}
header p{margin:6px 0 0;color:rgba(255,255,255,.8);font-size:15px}
main{max-width:560px;margin:0 auto;padding:18px 16px max(48px,env(safe-area-inset-bottom))}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 2px 10px rgba(30,41,59,.06)}
.sum small{display:block;color:var(--mute);font-size:13px}
.sum b{display:block;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sum .total{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:#fff;display:flex;justify-content:space-between;align-items:baseline}
.sum .total small{color:rgba(255,255,255,.85);font-size:15px;font-weight:700}
.sum .total b{font-size:26px}
nav{position:sticky;top:0;z-index:5;margin:14px -16px 0;padding:10px 16px;background:var(--bg);display:flex;gap:8px}
nav button{font:inherit;font-size:15px;font-weight:700;min-height:44px;padding:8px 20px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--mute);cursor:pointer}
nav button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.3)}
nav button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cols,.row{display:grid;grid-template-columns:30px 1fr 84px 84px;gap:8px;align-items:center}
.cols{padding:4px 14px;color:var(--mute);font-size:13px;text-align:right}
.cols span:nth-child(2){text-align:left;grid-column:1/3}
.list{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.row{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 14px;box-shadow:0 2px 8px rgba(30,41,59,.05)}
.no{width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--accent);font-size:12px;font-weight:700;display:grid;place-items:center}
.name{font-weight:700;font-size:16px;line-height:1.3;min-width:0}
.name small{display:block;color:var(--mute);font-weight:400;font-size:12.5px}
.chip{display:inline-block;margin-top:3px;padding:1px 9px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:12.5px;font-weight:500}
.amt{text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
.amt.spon{color:var(--accent);font-weight:700}
.amt.none{color:#cbd5e1}
@media (max-width:360px){.cols,.row{grid-template-columns:26px 1fr 74px 74px;gap:6px}.amt{font-size:14px}}
</style>
</head>
<body>
<header>
<h1>2026년 가호회<br>회비 및 찬조</h1>
<p id="sub"></p>
</header>
<main>
<section class="sum" aria-label="합계">
<div><small>회비 합계</small><b id="s1"></b></div>
<div><small>여행 찬조 합계</small><b id="s2"></b></div>
<div class="total"><small>총합계</small><b id="s3"></b></div>
</section>
<nav id="tabs" aria-label="보기"></nav>
<div class="cols" aria-hidden="true"><span>연번</span><span>성명</span><span>회비</span><span>여행 찬조</span></div>
<div class="list" id="list"></div>
</main>
<script>
const ROWS=[{"n": 1, "name": "류동화", "sub": "", "dues": 100000, "spon": 100000, "note": ""}, {"n": 2, "name": "류명희", "sub": "대구", "dues": 100000, "spon": 0, "note": ""}, {"n": 3, "name": "류명희", "sub": "합천", "dues": 100000, "spon": 200000, "note": ""}, {"n": 4, "name": "류민옥", "sub": "", "dues": 200000, "spon": 100000, "note": ""}, {"n": 5, "name": "류수남", "sub": "", "dues": 100000, "spon": 1000000, "note": "보라색손수건찬조"}, {"n": 6, "name": "류영형", "sub": "", "dues": 100000, "spon": 200000, "note": ""}, {"n": 7, "name": "류영희", "sub": "", "dues": 100000, "spon": 100000, "note": ""}, {"n": 8, "name": "류월수", "sub": "", "dues": 100000, "spon": 0, "note": ""}, {"n": 9, "name": "류용주", "sub": "", "dues": 100000, "spon": 100000, "note": ""}, {"n": 10, "name": "류위웅", "sub": "", "dues": 100000, "spon": 100000, "note": ""}, {"n": 11, "name": "류위갑", "sub": "위철 동생", "dues": 0, "spon": 500000, "note": ""}, {"n": 12, "name": "류위철", "sub": "", "dues": 100000, "spon": 100000, "note": ""}, {"n": 13, "name": "류윤옥", "sub": "위택 누님", "dues": 0, "spon": 200000, "note": ""}, {"n": 14, "name": "류위택", "sub": "", "dues": 100000, "spon": 0, "note": ""}, {"n": 15, "name": "류은자", "sub": "", "dues": 100000, "spon": 0, "note": ""}, {"n": 16, "name": "류인숙", "sub": "", "dues": 100000, "spon": 200000, "note": ""}, {"n": 17, "name": "류인순", "sub": "", "dues": 100000, "spon": 100000, "note": "떡 찬조"}, {"n": 18, "name": "류증자", "sub": "", "dues": 100000, "spon": 0, "note": ""}, {"n": 19, "name": "류태년", "sub": "", "dues": 100000, "spon": 100000, "note": ""}, {"n": 20, "name": "류해수", "sub": "", "dues": 100000, "spon": 480000, "note": ""}, {"n": 21, "name": "류행자", "sub": "", "dues": 100000, "spon": 100000, "note": ""}, {"n": 22, "name": "류홍률", "sub": "", "dues": 100000, "spon": 200000, "note": ""}, {"n": 23, "name": "류홍숙", "sub": "", "dues": 100000, "spon": 100000, "note": ""}, {"n": 24, "name": "류홍재", "sub": "", "dues": 100000, "spon": 100000, "note": ""}, {"n": 25, "name": "류홍철", "sub": "", "dues": 100000, "spon": 100000, "note": ""}, {"n": 26, "name": "류홍희", "sub": "", "dues": 100000, "spon": 0, "note": ""}, {"n": 27, "name": "류희자", "sub": "", "dues": 100000, "spon": 100000, "note": "김밥 찬조"}, {"n": 28, "name": "이재열", "sub": "용주중 동기", "dues": 0, "spon": 100000, "note": ""}, {"n": 29, "name": "정은희", "sub": "", "dues": 100000, "spon": 100000, "note": ""}, {"n": 30, "name": "류해수", "sub": "별도방값", "dues": 0, "spon": 200000, "note": ""}, {"n": 31, "name": "류수남", "sub": "별도방값", "dues": 0, "spon": 200000, "note": ""}];
const f=n=>n.toLocaleString('ko-KR');
const sum=k=>ROWS.reduce((a,r)=>a+r[k],0);
const payers=ROWS.filter(r=>r.dues).length;
document.getElementById('sub').textContent='회비 납부 '+payers+'명';
document.getElementById('s1').textContent=f(sum('dues'))+'원';
document.getElementById('s2').textContent=f(sum('spon'))+'원';
document.getElementById('s3').textContent=f(sum('dues')+sum('spon'))+'원';
const tabs=document.getElementById('tabs'),list=document.getElementById('list');
const modes=[['전체',()=>true],['찬조',r=>r.spon>0]];
let mode=0;
function cell(v,cls){return v?'<span class="amt '+cls+'">'+f(v)+'</span>':'<span class="amt none">-</span>'}
function render(){
  list.innerHTML=ROWS.filter(modes[mode][1]).map(r=>
    '<div class="row"><span class="no">'+r.n+'</span><div class="name">'+r.name+(r.sub?'<small>'+r.sub+'</small>':'')+(r.note?'<span class="chip">'+r.note+'</span>':'')+'</div>'+cell(r.dues,'')+cell(r.spon,'spon')+'</div>').join('');
  [...tabs.children].forEach((b,i)=>b.setAttribute('aria-pressed',i===mode));
}
modes.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m[0]+' '+ROWS.filter(m[1]).length;b.onclick=()=>{mode=i;render()};tabs.appendChild(b)});
render();
</script>
</body>
</html>
