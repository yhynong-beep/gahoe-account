<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌺 가호회 장부</title>
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --income-color: #16a34a;
            --expense-color: #dc2626;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.08);
        }

        /* 헤더 */
        header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 24px 20px 20px 20px;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .header-title {
            font-size: 22px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-balance {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-md);
            padding: 14px;
            margin-top: 8px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .summary-item .label {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 4px;
        }

        .summary-item .val {
            font-size: 16px;
            font-weight: 700;
        }

        .share-banner-btn {
            width: 100%;
            background-color: #fee500;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-top: 12px;
        }

        .share-banner-btn:active {
            transform: scale(0.98);
            background-color: #fada00;
        }

        /* 탭 메뉴 */
        .tab-section {
            display: flex;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 148px;
            z-index: 90;
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-sub);
            border: none;
            background: none;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* 메인 리스트 */
        main {
            padding: 16px 20px 40px 20px;
            flex: 1;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-card {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.1s ease, background-color 0.2s;
        }

        .history-card:hover {
            border-color: var(--primary);
        }

        .history-card:active {
            transform: scale(0.98);
            background-color: #f8fafc;
        }

        .history-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .icon-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            flex-shrink: 0;
        }

        .icon-income { background: linear-gradient(135deg, #22c55e, #15803d); }
        .icon-expense { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .icon-link { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }

        .history-info {
            min-width: 0;
        }

        .history-info .title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-info .date {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .history-right {
            text-align: right;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .amount-income {
            font-size: 15px;
            font-weight: 700;
            color: var(--income-color);
        }

        .amount-expense {
            font-size: 15px;
            font-weight: 700;
            color: var(--expense-color);
        }

        .link-badge-text {
            font-size: 13px;
            font-weight: 700;
            color: #3b82f6;
            background: #eff6ff;
            padding: 4px 10px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .balance-text {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        /* 토스트 메시지 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: rgba(15, 23, 42, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--text-sub);
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <header>
        <div class="header-top">
            <div class="header-title">
                <i class="fa-solid fa-users"></i> 가호회 장부
            </div>
            <div class="badge-balance" id="currentBalanceBadge">잔액: 계산중...</div>
        </div>
        
        <div class="summary-card">
            <div class="summary-item">
                <div class="label">총 입금액</div>
                <div class="val" id="totalIncomeVal">0원</div>
            </div>
            <div class="summary-item">
                <div class="label">총 출금액</div>
                <div class="val" id="totalExpenseVal">0원</div>
            </div>
        </div>

        <button class="share-banner-btn" onclick="shareSite()">
            <i class="fa-solid fa-share-nodes"></i> 가호회 링크 카톡으로 공유하기
        </button>
    </header>

    <div class="tab-section">
        <button class="tab-btn active" onclick="setTab('all', this)">전체 내역</button>
        <button class="tab-btn" onclick="setTab('입금', this)">입금만</button>
        <button class="tab-btn" onclick="setTab('출금', this)">출금만</button>
    </div>

    <main>
        <div class="list-container" id="historyList"></div>
    </main>

    <footer>
        <p>© 가호회. 모임 내역 및 회비 입출금 현황</p>
    </footer>
</div>

<div class="toast" id="toast">
    <i class="fa-solid fa-circle-check" style="color: #4ade80;"></i>
    <span id="toastMsg">링크가 복사되었습니다!</span>
</div>

<script>
    let historyData = [];
    let currentFilter = 'all';

    async function loadData() {
        try {
            const response = await fetch('data.json');
            historyData = await response.json();
            renderList();
        } catch (error) {
            console.error('데이터를 불러오는데 실패했습니다.', error);
        }
    }

    function renderList() {
        const container = document.getElementById('historyList');
        container.innerHTML = '';

        let totalIncome = 0;
        let totalExpense = 0;
        let lastBalance = 0;

        historyData.forEach(item => {
            if (item.type === '입금') totalIncome += item.amount;
            if (item.type === '출금') totalExpense += item.amount;
            if (item.balance > 0) lastBalance = item.balance;
        });

        document.getElementById('totalIncomeVal').innerText = totalIncome.toLocaleString() + '원';
        document.getElementById('totalExpenseVal').innerText = totalExpense.toLocaleString() + '원';
        document.getElementById('currentBalanceBadge').innerText = '잔액: ' + lastBalance.toLocaleString() + '원';

        const filtered = historyData.filter(item => {
            if (currentFilter === 'all') return true;
            return item.type === currentFilter;
        });

        filtered.forEach(item => {
            const hasLink = Boolean(item.link);
            const isPureLink = item.type === '링크' || (hasLink && item.amount === 0);

            const card = document.createElement(hasLink ? 'a' : 'div');
            card.className = 'history-card';

            if (hasLink) {
                card.href = item.link;
                card.target = "_blank";
                card.rel = "noopener noreferrer";
                card.style.textDecoration = "none";
                card.style.color = "inherit";
            }

            const isIncome = item.type === '입금';
            const isExpense = item.type === '출금';
            
            const iconClass = isPureLink ? 'icon-link' : (isIncome ? 'icon-income' : 'icon-expense');
            const iconSymbol = isPureLink ? 'fa-images' : (isIncome ? 'fa-arrow-down' : 'fa-arrow-up');

            card.innerHTML = `
                <div class="history-left">
                    <div class="icon-circle ${iconClass}">
                        <i class="fa-solid ${iconSymbol}"></i>
                    </div>
                    <div class="history-info">
                        <div class="title">
                            ${item.content}
                            ${hasLink ? '<i class="fa-solid fa-external-link-alt" style="font-size:11px; margin-left:4px; color:#3b82f6;"></i>' : ''}
                        </div>
                        <div class="date">${item.date || '기록 항목'}</div>
                    </div>
                </div>
                <div class="history-right">
                    ${isIncome ? `<div class="amount-income">+${item.amount.toLocaleString()}원</div>` : ''}
                    ${isExpense ? `<div class="amount-expense">-${item.amount.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",")}원</div>` : ''}
                    ${isPureLink ? `<div class="link-badge-text"><i class="fa-solid fa-arrow-up-right-from-square"></i> 보기</div>` : ''}
                    ${!isPureLink && item.balance > 0 ? `<div class="balance-text">잔액: ${item.balance.toLocaleString()}원</div>` : ''}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function setTab(filter, element) {
        currentFilter = filter;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        renderList();
    }

    function shareSite() {
        const shareData = {
            title: '🌺 가호회 장부',
            text: '가호회 회비 내역 및 입출금 현황입니다.',
            url: window.location.href
        };

        if (navigator.share) {
            navigator.share(shareData).catch(() => {});
        } else {
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast("링크가 클립보드에 복사되었습니다!");
            }).catch(() => {
                showToast("주소창의 링크를 복사해 공유해 주세요!");
            });
        }
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toastMsg').innerText = msg;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2500);
    }

    document.addEventListener('DOMContentLoaded', loadData);
</script>

</body>
</html>
