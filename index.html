<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌺 가호회 장부 및 모임 안내</title>
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --income-color: #16a34a;
            --expense-color: #dc2626;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.08);
        }

        /* 헤더 */
        header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 24px 20px 20px 20px;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .header-title {
            font-size: 22px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-balance {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-md);
            padding: 14px;
            margin-top: 8px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .summary-item .label {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 4px;
        }

        .summary-item .val {
            font-size: 16px;
            font-weight: 700;
        }

        .share-banner-btn {
            width: 100%;
            background-color: #fee500;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-top: 12px;
        }

        .share-banner-btn:active {
            transform: scale(0.98);
            background-color: #fada00;
        }

        /* 탭 메뉴 */
        .tab-section {
            display: flex;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 148px;
            z-index: 90;
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-sub);
            border: none;
            background: none;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* 메인 리스트 */
        main {
            padding: 16px 20px 40px 20px;
            flex: 1;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-card {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.1s ease, background-color 0.2s;
        }

        .history-card:hover {
            border-color: var(--primary);
        }

        .history-card:active {
            transform: scale(0.98);
            background-color: #f8fafc;
        }

        .history-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .icon-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            flex-shrink: 0;
        }

        .icon-income { background: linear-gradient(135deg, #22c55e, #15803d); }
        .icon-expense { background: linear-gradient(135deg, #ef4444, #b91c1c); }
