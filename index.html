<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>가호회 회계장부</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:#17231b;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;font-size:17px}.wrap{max-width:900px;margin:auto;padding:20px 14px 50px}.head{background:#14532d;color:white;border-radius:20px;padding:24px 20px;margin-bottom:16px}.head small{opacity:.85}.head h1{font-size:27px;margin:4px 0 18px}.balance{font-size:34px;font-weight:800;letter-spacing:-1px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.card{background:white;border-radius:15px;padding:16px;box-shadow:0 2px 8px #0000000a}.card span{display:block;color:#65736a;font-size:14px;margin-bottom:6px}.card strong{font-size:20px}.income{color:#087443}.expense{color:#c0392b}.tools{background:white;padding:14px;border-radius:15px;margin:14px 0;box-shadow:0 2px 8px #0000000a}.tools input{width:100%;font:inherit;padding:13px;border:1px solid #ccd5ce;border-radius:10px;margin-bottom:10px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{font:inherit;border:1px solid #ccd5ce;background:white;border-radius:30px;padding:8px 16px}.filters button.active{background:#14532d;color:white;border-color:#14532d}.count{color:#65736a;font-size:14px;margin:14px 2px}.tablebox{background:white;border-radius:15px;overflow:hidden;box-shadow:0 2px 8px #0000000a}table{width:100%;border-collapse:collapse}th,td{padding:13px 12px;border-bottom:1px solid #edf0ed;text-align:left}th{background:#edf4ee;color:#44564a;font-size:14px}td{font-size:15px}td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.tag{display:inline-block;border-radius:20px;padding:3px 9px;font-size:13px;font-weight:700}.tag.in{background:#e4f5eb;color:#087443}.tag.out{background:#ffebea;color:#b52d24}.empty{text-align:center;padding:35px;color:#69766e}.foot{text-align:center;color:#7b877e;font-size:12px;margin-top:18px}@media(max-width:560px){body{font-size:16px}.wrap{padding:12px 10px 35px}.head{padding:21px 17px}.head h1{font-size:24px}.balance{font-size:30px}th,td{padding:11px 7px;font-size:13px}th:nth-child(4),td:nth-child(4){display:none}.card strong{font-size:17px}}
</style></head><body><main class="wrap"><section class="head"><small>모임 회계 현황</small><h1>가호회 회계장부</h1><div class="balance" id="balance">-</div><small>현재 잔액</small></section><section class="cards"><div class="card"><span>총 입금액</span><strong class="income" id="income">-</strong></div><div class="card"><span>총 출금액</span><strong class="expense" id="expense">-</strong></div></section><section class="tools"><input id="search" type="search" placeholder="날짜 또는 내용 검색"><div class="filters"><button class="active" data-filter="전체">전체</button><button data-filter="입금">입금만</button><button data-filter="출금">출금만</button></div></section><div class="count" id="count"></div><section class="tablebox"><table><thead><tr><th>날짜</th><th>내용</th><th>구분</th><th>금액</th><th>잔액</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>조회 결과가 없습니다.</div></section><div class="foot">가호회 회계장부 · 공개 조회용</div></main>
<script>
const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';let all=[],filter='전체';
fetch('./data.json').then(r=>{if(!r.ok)throw Error('자료를 불러오지 못했습니다.');return r.json()}).then(d=>{all=d.records||[];document.getElementById('balance').textContent=won(d.summary.balance);document.getElementById('income').textContent=won(d.summary.income);document.getElementById('expense').textContent=won(d.summary.expense);render()}).catch(e=>{document.getElementById('rows').innerHTML='<tr><td colspan="5">자료를 불러오지 못했습니다.</td></tr>'});
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const list=all.filter(x=>(filter==='전체'||x.type===filter)&&(`${x.date} ${x.description} ${x.type}`.toLowerCase().includes(q)));document.getElementById('count').textContent=`전체 ${all.length}건 중 ${list.length}건 표시`;document.getElementById('empty').hidden=list.length!==0;document.getElementById('rows').innerHTML=list.map(x=>`<tr><td>${esc(x.date)}</td><td><a href="#" onclick="document.getElementById('search').value='${esc(x.description)}'; render(); return false;" style="color:#14532d; text-decoration:underline; font-weight:600; cursor:pointer;" title="클릭시 해당 내용 검색">${esc(x.description)}</a></td><td><span class="tag ${x.type==='입금'?'in':'out'}">${x.type}</span></td><td class="num">${won(x.amount)}</td><td class="num">${x.balance==null?'-':won(x.balance)}</td></tr>`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('search').addEventListener('input',render);document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('active',x===b));render()}));
</script></body></html>
