<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>목포 여행 - 류영형</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fdfbf7 0%, #eef2f7 100%);
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-sub: #718096;
      --accent-gold: #d69e2e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      word-break: keep-all;
    }

    .poem-card {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 50px 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(214, 158, 46, 0.2);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* 상단 포인트 장식 라인 */
    .poem-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #d69e2e, #3182ce, #d69e2e);
    }

    .poem-header {
      margin-bottom: 35px;
    }

    .poem-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }

    .poem-author {
      font-size: 1.1rem;
      color: var(--accent-gold);
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .divider {
      width: 40px;
      height: 2px;
      background-color: #e2e8f0;
      margin: 20px auto;
    }

    .poem-body {
      font-size: 1.25rem;
      line-height: 2.3;
      color: #2d3748;
      margin-bottom: 40px;
      font-family: 'Batang', 'Georgia', serif; /* 시 느낌을 살리는 명조체 계열 */
    }

    .poem-footer {
      font-size: 0.9rem;
      color: var(--text-sub);
      border-top: 1px dashed #e2e8f0;
      padding-top: 20px;
    }

    .footer-group {
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="poem-card">
    <!-- 시 제목 및 작가 -->
    <div class="poem-header">
      <h1 class="poem-title">목포 여행</h1>
      <div class="divider"></div>
      <p class="poem-author">지은이 : 류영형</p>
    </div>

    <!-- 시 본문 -->
    <div class="poem-body">
      천사 대교 바람 타고<br>
      유달산 자락에 새긴 추억<br><br>
      함께 웃던 그 미소 그대로<br>
      황금빛 계절 속에 머문다.
    </div>

    <!-- 하단 부가 정보 -->
    <div class="poem-footer">
      <p class="footer-group">가호회 · 21인방</p>
      <p>황금빛 추억을 담아 💛</p>
    </div>
  </div>

</body>
</html>
